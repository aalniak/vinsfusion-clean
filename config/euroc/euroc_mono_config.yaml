%YAML:1.0

#common parameters
#support: 1 imu 1 cam; 1 imu 2 cam: 2 cam;
imu: 0
num_of_cam: 1

imu_topic: "/imu0"
image0_topic: "/cam0/image_raw"
image1_topic: "/cam1/image_raw"
output_path: "/root/catkin_ws/src/VINS-Fusion/output"

cam0_calib: "cam0_mei.yaml"
cam1_calib: "cam1_mei.yaml"
image_width: 752
image_height: 480

# Extrinsic parameter between IMU and Camera.
estimate_extrinsic: 0   # Fixed for monocular-only mode.

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [0.0148655429818, -0.999880929698, 0.00414029679422, -0.0216401454975,
           0.999557249008, 0.0149672133247, 0.025715529948,  -0.064676986768,
           -0.0257744366974, 0.00375618835797, 0.999660727178, 0.00981073058949,
           0, 0, 0, 1]

#Multiple thread support
multiple_thread: 1

#feature tracker parameters
max_cnt: 150            # max feature number in feature tracking
min_dist: 30            # min distance between two features
freq: 10                # frequency (Hz) of publish tracking result
F_threshold: 1.0        # ransac threshold (pixel)
show_track: 1           # publish tracking image as topic
flow_back: 1            # perform forward and backward optical flow

#optimization parameters
max_solver_time: 0.04   # max solver iteration time (ms)
max_num_iterations: 8   # max solver iterations
keyframe_parallax: 10.0 # keyframe selection threshold (pixel)

#imu parameters kept for parser compatibility
acc_n: 0.1
gyr_n: 0.01
acc_w: 0.001
gyr_w: 0.0001
g_norm: 9.81007

#unsynchronization parameters
estimate_td: 0          # disabled in monocular-only mode
td: 0.0

#loop closure parameters
load_previous_pose_graph: 0
pose_graph_save_path: "/root/catkin_ws/src/VINS-Fusion/output/pose_graph/"
save_image: 1
